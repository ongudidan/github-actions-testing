name: Deploy to InfinityFree
# Run manually or on push to the main branch
on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy via lftp
    runs-on: ubuntu-latest

    steps:
      # Step 1: Clone the latest code from GitHub
      - name: Get latest code
        uses: actions/checkout@v4

      # Step 2: Set up PHP and Composer
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer
          coverage: none

      # Step 3: Cache Composer packages
      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      # Step 4: Generate production .env from GitHub Secret
      - name: Create production .env file
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "ERROR: PRODUCTION_ENV_FILE secret is missing."
            exit 1
          fi

          printf '%s' "$PRODUCTION_ENV_FILE" > .env
          chmod 600 .env

      # Step 5: Install production dependencies only
      - name: Install Composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction --no-scripts

      # Step 6: Strip unnecessary bloat from vendor to dramatically reduce file count
      - name: Optimize vendor directory for upload
        run: |
          echo "Pruning non-production files from vendor..."
          find vendor -type d \( -name "tests" -o -name "test" -o -name "docs" -o -name ".github" \) -exec rm -rf {} + 2>/dev/null || true
          find vendor -type f \( -name "*.md" -o -name "*.txt" -o -name "phpunit.xml*" -o -name ".travis.yml" -o -name "changelog*" \) -delete 2>/dev/null || true

      # Step 7: Run Laravel package discovery if artisan CLI exists
      - name: Run Laravel package discovery
        run: |
          if [ -f artisan ]; then
            php artisan package:discover --ansi
          fi

      # Step 8: Install lftp
      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      # Step 9: Deploy to InfinityFree via lftp
      - name: Deploy to InfinityFree via lftp
        env:
          FTP_SERVER: ftpupload.net
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp <<EOF
          set net:timeout 30
          set net:max-retries 3
          set ftp:ssl-allow false
          set ftp:passive-mode true
          open -u "$FTP_USERNAME","$FTP_PASSWORD" "$FTP_SERVER"
          mirror --reverse \
                 --continue \
                 --only-newer \
                 --parallel=2 \
                 --verbose \
                 --exclude-glob .git* \
                 --exclude-glob .github/ \
                 --exclude-glob tests/ \
                 --exclude-glob node_modules/ \
                 --exclude-glob *.backup \
                 --exclude README.md \
                 ./ htdocs/
          bye
          EOF

      # Step 10: Remove temporary .env from GitHub runner
      - name: Clean up temporary environment file
        if: always()
        run: rm -f .env
